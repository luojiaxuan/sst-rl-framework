# Shared GRPO defaults for InfiniSST 4B RL posttraining.
grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  max_rollout_turns: 60
  max_num_steps: 10000
  reduce_baseline_rewards: false
  normalize_rewards: false
  use_leave_one_out_baseline: false
  val_period: 10
  val_at_start: true
  max_val_samples: 512
  val_batch_size: 512

loss_fn:
  reference_policy_kl_penalty: 0.01
  ratio_clip_min: 0.2
  ratio_clip_max: 0.2
  ratio_clip_c: null
  use_on_policy_kl_approximation: true
  use_importance_sampling_correction: true
  token_level_loss: true

policy:
  model_name: "/ckpts/infinisst/yodas_5kh_v2_m12_stage2_4b_8k_4e-5_fix_4node/checkpoints/step=2000-last.ckpt.hf"
  tokenizer:
    name: ${policy.model_name}
  train_global_batch_size: 128
  train_micro_batch_size: 1
  generation_batch_size: 32
  logprob_batch_size: 4
  max_total_sequence_length: 4096
  precision: "bfloat16"
  fsdp_offload_enabled: false
  activation_checkpointing_enabled: false
  dtensor_cfg:
    enabled: true
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null
  dynamic_batching:
    enabled: true
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64
  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}
  max_grad_norm: 1.0
  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 1e-6
      weight_decay: 0.01
      betas: [0.9, 0.999]
      eps: 1e-8
      foreach: false
      fused: false
  scheduler:
    - name: "torch.optim.lr_scheduler.ConstantLR"
      kwargs:
        factor: 1.0
        total_iters: 10000000000
    - milestones: []
  generation:
    backend: "vllm"
    max_new_tokens: 40
    temperature: 1.0
    top_p: 0.999
    top_k: 10000
    max_token_id: 151645
    stop_token_ids: null
    stop_strings: null
    audio_token_id: 151656
    bad_words: ["\n"]
    vllm_cfg:
      async_engine: false
      precision: ${policy.precision}
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      gpu_memory_utilization: 0.6
      max_model_len: ${policy.max_total_sequence_length}
    vllm_kwargs:
      enable_prompt_embeds: false
    colocated:
      enabled: true
      resources:
        gpus_per_node: null
        num_nodes: null

data:
  train_data_shuffle: true
  val_data_shuffle: false
  seed: 42
  multiplier: 1

env:
  infinisst:
    actor_runtime_env: {}
    cfg:
      max_turns: ${grpo.max_rollout_turns}
      model_name: ${policy.model_name}
      batch_size: 32
      step_size: 1.12
      alpha: 1.0
      beta: 0.5
      max_latency: 10.0
      target_quality: -5.0
      hinge_granularity: "sentence"
      normalize: true
      num_gpus: 8

cluster:
  gpus_per_node: 8
  num_nodes: 2

checkpointing:
  enabled: true
  higher_is_better: true
  keep_top_k: 3
  save_period: 10

logger:
  log_dir: "logs"
  num_val_samples_to_print: 0
  wandb_enabled: true
  tensorboard_enabled: false
  monitor_gpus: true
  wandb:
    project: "infinisst-rl"
    name: grpo-4b-modular
  tensorboard: {}
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10
